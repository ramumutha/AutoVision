spring.application.name=autovision-platform

spring.datasource.url=${AUTOVISION_PLATFORM_DATABASE_URL:jdbc:postgresql://localhost:5432/autovision}
spring.datasource.username=${AUTOVISION_PLATFORM_DATABASE_USERNAME:autovision}
spring.datasource.password=${AUTOVISION_PLATFORM_DATABASE_PASSWORD}

spring.flyway.schemas=platform
spring.flyway.default-schema=platform

spring.jpa.properties.hibernate.default_schema=platform
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTOVISION_OIDC_ISSUER:http://localhost:8081/realms/autovision}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never