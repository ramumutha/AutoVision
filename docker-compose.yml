services:
  postgres:
    image: postgres:16-alpine
    container_name: autovision-postgres
    environment:
      POSTGRES_DB: autovision
      POSTGRES_USER: autovision
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - autovision_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: autovision-keycloak
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      AUTOVISION_PLATFORM_CLIENT_SECRET: ${AUTOVISION_PLATFORM_CLIENT_SECRET:?AUTOVISION_PLATFORM_CLIENT_SECRET is required}
    ports:
      - "8081:8080"
    volumes:
      - ./infra/keycloak/realm:/opt/keycloak/data/import:ro
    restart: unless-stopped

volumes:
  autovision_postgres_data: