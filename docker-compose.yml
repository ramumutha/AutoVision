services:
  postgres:
    image: postgres:16-alpine
    container_name: autovision-postgres
    environment:
      POSTGRES_DB: autovision
      POSTGRES_USER: autovision
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - autovision_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  autovision_postgres_data: